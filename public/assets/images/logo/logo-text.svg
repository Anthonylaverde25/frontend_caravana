<svg xmlns="http://www.w3.org/2000/svg" width="120" height="32" viewBox="0 0 120 32" fill="none">
  <!-- RXNA Cow head icon scaled down to 32x32 -->
  <g transform="scale(0.32)">
    <!-- Forehead Arch -->
    <path d="M 42 24 C 47 20, 53 20, 58 24" stroke="#0E3D26" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left Horn -->
    <path d="M 42 24 C 34 22, 26 21, 16 17 C 20 25, 25 30, 32 32" stroke="#0E3D26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Horn -->
    <path d="M 58 24 C 66 22, 74 21, 84 17 C 80 25, 75 30, 68 32" stroke="#0E3D26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left Ear -->
    <path d="M 33 34 C 23 33, 8 37, 8 44 C 8 51, 20 53, 32 47" stroke="#0E3D26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Ear -->
    <path d="M 67 34 C 77 33, 92 37, 92 44 C 92 51, 80 53, 68 47" stroke="#0E3D26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Face Outline & R Loop (Left Eye) -->
    <path d="M 31 46 C 32 58, 38 64, 44 64 C 49 64, 49 56, 44 56 C 39 56, 39 62, 44 62 L 35 71 C 39 78, 43 80, 46 80" stroke="#0E3D26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Face Outline & Right Eye -->
    <path d="M 69 46 C 68 58, 62 64, 56 64 C 51 64, 51 56, 56 56 C 61 56, 61 62, 56 62 L 65 71 C 61 78, 57 80, 54 80" stroke="#0E3D26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Snout / Chin Link -->
    <path d="M 46 80 C 48 82, 52 82, 54 80" stroke="#0E3D26" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="36" y="16" fill="#0E3D26" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" letter-spacing="1">RXNA</text>
  <text x="36" y="25" fill="#3A6351" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="5.5" letter-spacing="0.8">SISTEMA GANADERO</text>
</svg>
