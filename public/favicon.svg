<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Solid Circular Backdrop for high contrast in browser tabs (light/dark) -->
  <circle cx="50" cy="50" r="48" fill="#0E3D26"/>
  
  <!-- Forehead Arch -->
  <path d="M 42 26 C 47 22, 53 22, 58 26" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
  
  <!-- Left Horn -->
  <path d="M 42 26 C 34 24, 26 23, 16 19 C 20 27, 25 32, 32 34" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Horn -->
  <path d="M 58 26 C 66 24, 74 23, 84 19 C 80 27, 75 32, 68 34" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Left Ear -->
  <path d="M 33 36 C 23 35, 8 39, 8 46 C 8 53, 20 55, 32 49" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Ear -->
  <path d="M 67 36 C 77 35, 92 39, 92 46 C 92 53, 80 55, 68 49" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left Face Outline & R Loop (Left Eye) -->
  <path d="M 31 48 C 32 60, 38 66, 44 66 C 49 66, 49 58, 44 58 C 39 58, 39 64, 44 64 L 35 73 C 39 80, 43 82, 46 82" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Face Outline & Right Eye -->
  <path d="M 69 48 C 68 60, 62 66, 56 66 C 51 66, 51 58, 56 58 C 61 58, 61 64, 56 64 L 65 73 C 61 80, 57 82, 54 82" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Snout / Chin Link -->
  <path d="M 46 82 C 48 84, 52 84, 54 82" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
</svg>
